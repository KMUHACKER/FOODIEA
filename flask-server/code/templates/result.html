<!DOCTYPE html><html lang="ko"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>식재료 선택</title></head><body>    <h1>사용할 식재료 선택</h1>    <form action="/select_ingredients" method="POST">        <!-- 탐지된 식재료 목록을 선택할 수 있는 체크박스 (사용할 식재료) -->        <div>            <h3>탐지된 식재료 (사용할 식재료 선택):</h3>            {% for ingredient in detected_ingredients %}                <input type="checkbox" id="use_{{ ingredient }}" name="use_ingredients" value="{{ ingredient }}">                <label for="use_{{ ingredient }}">{{ ingredient }}</label><br>            {% endfor %}        </div>        <br>        <!-- 제외할 식재료 선택 (체크박스) -->        <div>            <h3>탐지된 식재료 (제외할 식재료 선택):</h3>            {% for ingredient in detected_ingredients %}                <input type="checkbox" id="exclude_{{ ingredient }}" name="exclude_ingredients" value="{{ ingredient }}">                <label for="exclude_{{ ingredient }}">{{ ingredient }}</label><br>            {% endfor %}        </div>        <br>        <button type="submit">선택 완료</button>    </form></body></html>

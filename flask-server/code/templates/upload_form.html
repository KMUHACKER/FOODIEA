<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>이미지 업로드</title></head><body>    <h1>이미지 파일 업로드</h1>    <form action="/upload" method="POST" enctype="multipart/form-data">        <!-- 모바일에서는 카메라, 데스크탑에서는 파일 탐색기 -->        <input type="file" name="file" accept="image/*" required>        <button type="submit">업로드</button>    </form></body></html>
